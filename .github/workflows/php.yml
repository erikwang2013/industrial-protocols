name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
      - name: Validate composer.json
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run tests
        run: |
          if [ "${{ matrix.php }}" = "8.3" ]; then
            vendor/bin/phpunit --coverage-text --fail-on-warning --fail-on-deprecation
          else
            vendor/bin/phpunit --no-coverage --fail-on-warning --fail-on-deprecation
          fi
      - name: Run PHPStan
        if: matrix.php == '8.3'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
